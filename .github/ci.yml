 @"
    name: Docker Build CI

    on:
      push:
        branches: [ main ]
      workflow_dispatch:

    jobs:
      build-test:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout repository
            uses: actions/checkout@v4

          - name: Build Docker image
            run: docker build -t my-web:ci .
    "@ | Set-Content -Encoding utf8 .github\workflows\ci.yml